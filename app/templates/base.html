<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ReferralFlow{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16302b;         /* text, headings */
    --muted: #5b6b66;
    --paper: #f7f8f5;       /* page */
    --sheet: #ffffff;       /* panels */
    --rule: #d9ddd3;
    --toner: #2b4c7e;       /* actions and links */
    --review-fg: #8a5200; --review-bg: #fcefd9;
    --ok-fg: #1f6b45;     --ok-bg: #e1f1e7;
    --fail-fg: #a1261b;   --fail-bg: #f9e2de;
    --route-fg: #3a4a5c;  --route-bg: #e6eaf0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 15px/1.5 "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
         font-variant-numeric: tabular-nums; }
  a { color: var(--toner); }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 3px solid var(--toner); outline-offset: 2px; }
  header.top { display: flex; align-items: baseline; gap: 24px; flex-wrap: wrap;
               padding: 18px 32px; border-bottom: 1px solid var(--rule); background: var(--sheet); }
  header.top h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  header.top h1 a { color: inherit; text-decoration: none; }
  header.top p { margin: 0; color: var(--muted); }
  main { padding: 24px 32px 64px; max-width: 1280px; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; align-items: start; }
  @media (max-width: 960px) { .grid { grid-template-columns: 1fr; } main, header.top { padding-left: 16px; padding-right: 16px; } }
  .panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding: 18px; }
  .panel + .panel { margin-top: 20px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 600; color: var(--muted); font-size: 13px;
       border-bottom: 1px solid var(--rule); padding: 8px 10px; }
  td { border-bottom: 1px solid #eceee8; padding: 10px; vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  .scroll { overflow-x: auto; }
  .status { display: inline-block; padding: 1px 8px; border-radius: 3px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .status.needs_review { color: var(--review-fg); background: var(--review-bg); }
  .status.delivered { color: var(--ok-fg); background: var(--ok-bg); }
  .status.delivery_failed { color: var(--fail-fg); background: var(--fail-bg); }
  .status.routed, .status.received { color: var(--route-fg); background: var(--route-bg); }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  button, .button { font: inherit; font-weight: 600; background: var(--toner); color: #fff; border: 0;
           border-radius: 3px; padding: 7px 14px; cursor: pointer; }
  button.secondary { background: transparent; color: var(--toner); border: 1px solid var(--toner); }
  input, select { font: inherit; padding: 6px 8px; border: 1px solid #b9c0b5; border-radius: 3px;
                  background: #fff; color: var(--ink); min-width: 0; }
  form.inline { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .notice { padding: 10px 12px; border-radius: 3px; margin-top: 12px; display: none; }
  .notice.show { display: block; }
  .notice.error { background: var(--fail-bg); color: var(--fail-fg); }
  .notice.ok { background: var(--ok-bg); color: var(--ok-fg); }
  @media (prefers-reduced-motion: no-preference) { .meter span { transition: width .4s ease; } }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header class="top">
  <h1><a href="/">ReferralFlow</a></h1>
  {% block header %}{% endblock %}
  <p style="margin-left:auto"><a href="/docs">API docs</a></p>
</header>
<main>{% block main %}{% endblock %}</main>
</body>
</html>
